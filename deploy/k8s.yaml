apiVersion: apps/v1
kind: Deployment
metadata:
  name: anywhere-agent
  namespace: private
  labels:
    app: anywhere-agent
spec:
  replicas: 5
  selector:
    matchLabels:
      app: anywhere-agent
  template:
    metadata:
      labels:
        app: anywhere-agent
    spec:
      containers:
        - name: anywhere-agent
          # Replace with your registry/tag, or render this file with envsubst/kustomize.
          image: registry.example.com/cntechpower/anywhere-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_ADDR
              value: anywhere.example.com
            - name: ZONE_NAME
              value: asia-shanghai
            - name: USER_NAME
              value: admin
            - name: TLS_SERVER_NAME
              value: anywhere.local
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anywhere-agent
                  key: password
          resources:
            limits:
              memory: 512Mi
              cpu: 1
            requests:
              memory: 256Mi
              cpu: "0.5"
