version: '3'
services:
# Anywhere Proxy
  anywhered:
    image: "anywhered-test-image:latest"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.11
    ports:
      - "1114:1114"
  anywhere-1:
    image: "anywhere-test-image:latest"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.12
    environment:
      - SERVER_ADDR=172.90.101.11
      - ZONE_NAME=asia-shanghai
      - USER_NAME=admin
      - PASSWORD=${AGENT_PASSWORD:-admin}
      - TLS_SERVER_NAME=anywhere.local
    depends_on:
      - anywhered
  anywhere-2:
    image: "anywhere-test-image:latest"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.13
    environment:
      - SERVER_ADDR=172.90.101.11
      - ZONE_NAME=asia-shanghai
      - USER_NAME=admin
      - PASSWORD=${AGENT_PASSWORD:-admin}
      - TLS_SERVER_NAME=anywhere.local
    depends_on:
      - anywhered
  anywhere-3:
    image: "anywhere-test-image:latest"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.14
    environment:
      - SERVER_ADDR=172.90.101.11
      - ZONE_NAME=asia-shanghai
      - USER_NAME=admin
      - PASSWORD=${AGENT_PASSWORD:-admin}
      - TLS_SERVER_NAME=anywhere.local
    depends_on:
      - anywhered

# Services
  mysql-8.0:
    image: "${TEST_REGISTRY:-docker.io}/mysql/mysql:8.0.19"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.21
  mysql-5.7:
    image: "${TEST_REGISTRY:-docker.io}/mysql/mysql:5.7.29"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.22
  nginx-1.17:
    image: "${TEST_REGISTRY:-docker.io}/cntechpower/nginx:1.17.6"
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.23
  sshd:
    image: "${TEST_REGISTRY:-docker.io}/cntechpwer/centos-systemd:7"
    privileged: true
    networks:
      anywhere_test_net:
        ipv4_address: 172.90.101.24
networks:
  anywhere_test_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.90.101.0/24
